[tools]
"aqua:goreleaser/goreleaser" = "2.17.1"
go = "1.26.5"
"aqua:dominikh/go-tools/staticcheck" = "2026.2"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = [
  "test -z \"$(gofmt -l .)\" || (gofmt -l . && exit 1)",
  "go vet ./...",
  "staticcheck ./...",
]

[tasks.build]
run = "go build -o bin/push-it ./cmd/push-it"

[tasks."glow:gnome:test"]
run = "gjs -m internal/glow/gnome/tests/run.js"
