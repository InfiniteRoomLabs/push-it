[tools]
"aqua:goreleaser/goreleaser" = "2.17.1"
go = "1.26.5"
"aqua:dominikh/go-tools/staticcheck" = "2026.2"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = [
  "test -z \"$(gofmt -l .)\" || (gofmt -l . && exit 1)",
  "go vet ./...",
  "staticcheck ./...",
  "mise run lint:scripts",
]

[tasks.build]
env = { CGO_ENABLED = "0" }
run = "go build -ldflags \"-s -w -X main.version=$(git describe --tags --always --dirty) -X main.commit=$(git rev-parse --short HEAD)\" -o bin/push-it ./cmd/push-it"

[tasks.release]
description = "Tag vX.Y.Z (needs a CHANGELOG section) and push the tag to every remote"
run = "sh scripts/release.sh {{arg(name='version')}}"

[tasks."lint:scripts"]
run = [
  "shellcheck -s sh install.sh scripts/*.sh",
  "sh scripts/test-changelog-notes.sh",
  "sh scripts/test-install-sh.sh",
  "goreleaser check",
]

[tasks."glow:gnome:test"]
run = "gjs -m internal/glow/gnome/tests/run.js"

[tasks."glow:macos:build"]
run = "sh internal/glow/macos/build.sh"

[tasks."glow:gnome:dev"]
description = "Nested GNOME Shell running the extension from the working tree (no logout per change)"
run = "sh scripts/glow-gnome-dev.sh"
